apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: offers-notification-ingress
  namespace: offers-notification
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: offers-notification.local
      http:
        paths:
          - path: /api/v1/offers
            pathType: Prefix
            backend:
              service:
                name: offers-service
                port:
                  number: 8080
          - path: /api/v1/events
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8080
          - path: /api/v1/notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8080