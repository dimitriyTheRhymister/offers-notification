apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-offers
  namespace: offers-notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-offers
  template:
    metadata:
      labels:
        app: postgres-offers
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: offers_db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-offers
  namespace: offers-notification
spec:
  selector:
    app: postgres-offers
  ports:
    - port: 5432
      targetPort: 5432