apiVersion: apps/v1
kind: Deployment
metadata:
  name: offers-service
  namespace: offers-notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: offers-service
  template:
    metadata:
      labels:
        app: offers-service
    spec:
      containers:
        - name: offers-service
          image: offers-notification-offers-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: OFFERS_DB_URL
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: POSTGRES_PASSWORD
            - name: NOTIFICATION_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: NOTIFICATION_URL