services:
  postgres-offers:
    image: postgres:16
    container_name: pg-offers
    environment:
      POSTGRES_DB: offers_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg-offers-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d offers_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres-notification:
    image: postgres:16
    container_name: pg-notification
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pg-notification-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    environment:
      DB_URL: jdbc:postgresql://postgres-notification:5432/notification_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8081:8080"
    depends_on:
      postgres-notification:
        condition: service_healthy

  offers-service:
    build:
      context: .
      dockerfile: offers-service/Dockerfile
    container_name: offers-service
    environment:
      DB_URL: jdbc:postgresql://postgres-offers:5432/offers_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      NOTIFICATION_URL: http://notification-service:8080/internal/api/v1/events
    ports:
      - "8080:8080"
    depends_on:
      postgres-offers:
        condition: service_healthy
      notification-service:
        condition: service_started

volumes:
  pg-offers-data:
  pg-notification-data: